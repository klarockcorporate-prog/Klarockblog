<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">FINANCIERO &#183; SENTIMIENTO DE INVERSIÓN</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">El 83% ya decidió: el capital</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">institucional no espera la tasa</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Sentimiento de inversión, Cap Rate y fundamentales en México, 2026</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">SENTIMIENTO INSTITUCIONAL · 1T26</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">83%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Mantendrá o aumentará su</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">inversión en México en 2026</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CAP RATE INDUSTRIAL · 2026</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">7&#8211;11%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Estable frente a inicios de</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">2025 (Colliers LatAm)</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">ABSORCIÓN NETA · 3T25</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">2.46M m&#178;</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Acumulada a nivel nacional</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">(CBRE)</text>
  </g>

  <!-- Convicción bar -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONVICCIÓN DEL CAPITAL · ENCUESTA CBRE 1T26</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">MANTIENE O AUMENTA</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">83% de los institucionales, frente a su exposición de 2025</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="216" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">AUMENTA MÁS DE 10%</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">20% busca crecer su exposición con doble dígito este año</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="52" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Motores CBRE -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CUATRO MOTORES DETRÁS DE LA CONVICCIÓN (CBRE)</text>
  <g transform="translate(80,878)">
    <rect width="507" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="40" fill="#ffffff" font-size="17" font-weight="600">Reducción en costos de deuda</text>
    <text x="28" y="66" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Financiamiento más predecible pese a</text>
    <text x="28" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">tasa de referencia elevada</text>
  </g>
  <g transform="translate(613,878)">
    <rect width="507" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="40" fill="#ffffff" font-size="17" font-weight="600">Mejora en perspectivas de renta</text>
    <text x="28" y="66" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Demanda que sostiene crecimiento</text>
    <text x="28" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">de precios por corredor</text>
  </g>
  <g transform="translate(80,1020)">
    <rect width="507" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="40" fill="#ffffff" font-size="17" font-weight="600">Oferta disciplinada</text>
    <text x="28" y="66" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Desarrolladores más selectivos tras</text>
    <text x="28" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">el ciclo de expansión especulativa</text>
  </g>
  <g transform="translate(613,1020)">
    <rect width="507" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="40" fill="#ffffff" font-size="17" font-weight="600">Demanda ocupacional resiliente</text>
    <text x="28" y="66" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">2.46M m² de absorción neta</text>
    <text x="28" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">acumulada al 3T25</text>
  </g>

  <!-- Contexto macro -->
  <text x="80" y="1206" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO MACRO · AGOSTO 2026</text>
  <g transform="translate(80,1226)">
    <rect width="1040" height="150" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">Banxico sostiene la tasa en 6.50% (2ª pausa consecutiva) &#183; Inflación general en 3.12%, mínimo desde may-2020</text>
    <text x="32" y="70" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Costo de construcción sube 4.59% interanual &#183; Vacancia industrial Monterrey en 6.9% (1.2M m²) tras oferta</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">especulativa &#183; Meta de inflación de 3% aplazada hasta finales de 2027 (Banxico)</text>
    <text x="32" y="126" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif" font-weight="600">Financiamiento predecible + Cap Rate aún sin comprimir = ventana de entrada institucional</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: CBRE (Encuesta de Sentimiento de Inversión 1T26, Reporte Industrial 3T25), Colliers (LatAm Cap Rates Report), Banxico, INEGI.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
