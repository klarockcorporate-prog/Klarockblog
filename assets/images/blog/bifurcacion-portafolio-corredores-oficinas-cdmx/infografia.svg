<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">CORPORATIVO · MERCADO DE OFICINAS</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">Bosques a $27, Norte a $18: la</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">bifurcación del portafolio corporativo</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Cómo las empresas dividen su huella de oficinas entre torres prime y corredores accesibles, CDMX 2026</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA CBD CDMX · 1T 2026</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">11.15%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Lomas-Palmas, Polanco y</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Reforma (CBRE/Colliers)</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">BRECHA BOSQUES VS. NORTE</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">~50%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">$27 vs. $18.02 USD/m²,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">misma calidad Clase A</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">RENTA PROMEDIO NACIONAL</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">$21.71</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">USD/m² · 2T 2026,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">+3.96% trimestral</text>
  </g>

  <!-- Corridor rent bars -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">RENTA POR CORREDOR · USD/M², 2026</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">BOSQUES DE LAS LOMAS</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">$27.00 USD/m² · el corredor más caro del Valle de México</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">INSURGENTES</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">$21.89 USD/m² · mayor liquidez, +600 espacios activos</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="211" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,816)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">NORTE</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">$18.02 USD/m² · el corredor más accesible del área metropolitana</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="173" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Two boxes -->
  <text x="80" y="1000" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">ABSORCIÓN Y ESTRATEGIA · 1T-2T 2026</text>
  <g transform="translate(80,1020)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">30,816 m² de absorción neta</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">1T 2026, frente a 52,682 m²</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">en 1T 2025: positiva pero cada</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">vez más selectiva</text>
  </g>
  <g transform="translate(610,1020)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">Sede prime, back-office accesible</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Dirección y cara al cliente en torres</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Clase A+; soporte administrativo en</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">corredores de menor costo</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1232" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · LA MISMA LÓGICA SE REPITE A NIVEL NACIONAL</text>
  <g transform="translate(80,1252)">
    <rect width="1040" height="150" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">El nearshoring también empuja demanda de oficinas en Monterrey, Guadalajara y Querétaro</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Monterrey concentra funciones ejecutivas en San Pedro Garza García y Valle Oriente; Guadalajara</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">atrae talento técnico de semiconductores en Providencia y Puerta de Hierro. La bifurcación entre</text>
    <text x="32" y="120" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">sede y soporte operativo ya no es exclusiva de la CDMX.</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: El Financiero (30 sep 2026), Colliers Oficinas CDMX 1T-2T 2026, CBRE/Inmobiliare. Cifras citadas por medios especializados; validar contra reporte trimestral oficial antes de uso contractual.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
