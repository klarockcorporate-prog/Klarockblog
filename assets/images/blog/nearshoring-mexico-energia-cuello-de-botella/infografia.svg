    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">Vacancia 7.5% · $7.00/m&#178;</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Renta promedio mensual estable,</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">sin presión especulativa (Colliers)</text>
  </g>
  <g transform="translate(610,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">Absorción neta · 186,000 m&#178;</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Desarrollo activo en Apodaca,</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Guadalupe, Ciénega de Flores y Pesquería</text>
