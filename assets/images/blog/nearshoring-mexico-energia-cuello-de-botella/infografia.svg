    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">El capital no es el limitante</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">(AMPIP)</text>
  </g>

