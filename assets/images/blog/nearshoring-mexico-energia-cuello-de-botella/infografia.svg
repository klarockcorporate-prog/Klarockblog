    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Con recorte real de 16.7% en</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">el presupuesto de CFE</text>
  </g>
