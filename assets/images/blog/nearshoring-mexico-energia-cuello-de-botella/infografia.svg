    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">El activo industrial ganador no es el más barato: es el que ya tiene KVA certificada o última milla asegurada</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">La debida diligencia energética pesa hoy tanto como la legal en cualquier</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">evaluación de sitio industrial</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: AMPIP, cobertura sectorial (Energy Magazine, Vanguardia Industrial, GPI News), Real Estate Market, Colliers Monterrey 1T 2026. Cifras energéticas de cobertura de prensa consistente entre fuentes, no de un reporte único.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
