    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">ÚLTIMA MILLA ZMVM · SOBRA ENERGÍA, FALTA SUELO</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">Vacancia de 3%-4%, mínimo histórico del segmento logístico</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="26" height="14" rx="7" fill="#d4b45f"/>
