<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1f38"/>
      <stop offset="55%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1080 M0,48 H1080 M0,96 H1080 M0,144 H1080 M0,1776 H1080 M0,1824 H1080 M0,1872 H1080"/>
  </g>

  <!-- Header -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="50" height="50" rx="7" fill="#c9a84c"/>
    <g transform="translate(14,11) scale(0.35)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="66" y="22" fill="#f5f5f0" font-size="22" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="66" y="41" fill="#9aa5b1" font-size="10" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <!-- Headline block, centered -->
  <text x="540" y="230" fill="#d4b45f" font-size="17" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">MERCADO · DUE DILIGENCE</text>

  <text x="540" y="308" fill="#ffffff" font-size="56" font-weight="600" text-anchor="middle">El costo oculto</text>
  <text x="540" y="374" fill="#ffffff" font-size="56" font-weight="600" text-anchor="middle">de copiar y pegar</text>
  <text x="540" y="440" fill="#ffffff" font-size="56" font-weight="600" text-anchor="middle">tesis inmobiliarias</text>

  <rect x="470" y="472" width="140" height="5" fill="url(#goldbar)"/>

  <text x="540" y="530" fill="#c3cad9" font-size="21" font-family="Arial, sans-serif" text-anchor="middle">Misma tesis de nearshoring, hasta 8 puntos</text>
  <text x="540" y="562" fill="#c3cad9" font-size="21" font-family="Arial, sans-serif" text-anchor="middle">de diferencia en vacancia entre corredores</text>

  <!-- Stat card 1 -->
  <g transform="translate(70,620)">
    <rect width="940" height="270" rx="8" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="470" y="52" fill="#d4b45f" font-size="16" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">VACANCIA EN CIUDAD JUÁREZ</text>
    <text x="470" y="168" fill="#ffffff" font-size="104" font-weight="700" text-anchor="middle">~10%</text>
    <text x="470" y="216" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">Sobreoferta especulativa &#8212; la misma tesis que Saltillo</text>
    <text x="470" y="242" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">construida sin demanda local comprobada</text>
  </g>

  <!-- Stat card 2 -->
  <g transform="translate(70,920)">
    <rect width="940" height="270" rx="8" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="470" y="52" fill="#d4b45f" font-size="16" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">VACANCIA EN SALTILLO / PUEBLA</text>
    <text x="470" y="168" fill="#ffffff" font-size="104" font-weight="700" text-anchor="middle">&lt;2%</text>
    <text x="470" y="216" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">Misma tesis macro, pero con demanda de</text>
    <text x="470" y="242" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">proveeduría local ya establecida y validada</text>
  </g>

  <!-- Stat card 3 -->
  <g transform="translate(70,1220)">
    <rect width="940" height="270" rx="8" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="470" y="52" fill="#d4b45f" font-size="16" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">ABSORCIÓN VÍA BUILT-TO-SUIT EN MTY</text>
    <text x="470" y="168" fill="#ffffff" font-size="104" font-weight="700" text-anchor="middle">67%</text>
    <text x="470" y="216" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">El capital que hoy se despliega exige demanda</text>
    <text x="470" y="242" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">contractual comprobada antes de construir</text>
  </g>

  <!-- Closing line -->
  <text x="540" y="1580" fill="#ffffff" font-size="26" font-weight="600" text-anchor="middle">La pregunta no es "&#191;esto funcionó allá?"</text>
  <text x="540" y="1618" fill="#e6cf94" font-size="26" font-weight="600" text-anchor="middle">Es qué se validó aquí, con datos.</text>

  <!-- Footer -->
  <line x1="70" y1="1800" x2="1010" y2="1800" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="540" y="1846" fill="#9aa5b1" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">DM para el dossier de validación de demanda local</text>
  <text x="540" y="1882" fill="#d4b45f" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" font-weight="700" letter-spacing="1">klarock.mx</text>
</svg>
