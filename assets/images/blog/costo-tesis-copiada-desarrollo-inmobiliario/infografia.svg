<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">MERCADO · DUE DILIGENCE</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">El costo oculto de copiar</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">y pegar tesis inmobiliarias</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Misma tesis de nearshoring, hasta 8 puntos de diferencia en vacancia entre corredores</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA EN CD. JUÁREZ</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">~10%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Sobreoferta especulativa,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">misma tesis que Saltillo</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA EN SALTILLO / PUEBLA</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">&lt;2%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Con demanda de proveeduría</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">local ya establecida y validada</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">ABSORCIÓN VÍA BUILT-TO-SUIT</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">67%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">En Monterrey, con demanda</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">contractual comprobada antes</text>
  </g>

  <!-- Misma tesis, resultados opuestos -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">MISMA TESIS DE NEARSHORING, RESULTADOS OPUESTOS</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">TIJUANA Y REYNOSA: SOBREOFERTA FRONTERIZA</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">Vacancia cercana a 8% y superior a 5% tras construir sobre demanda anticipada, no confirmada</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="150" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">SALTILLO, PUEBLA Y AGUASCALIENTES: DEMANDA VALIDADA</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">Vacancia por debajo de 2% donde la tesis se sustentó en proveeduría ya instalada, no en analogía</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="245" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Panorama: mismo patrón en retail -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL MISMO PATRÓN, EN RETAIL</text>
  <g transform="translate(80,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="24" font-weight="700">Strip mall / power center</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Modelo suburbano de EE.UU.</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">copiado sin adaptar densidad</text>
  </g>
  <g transform="translate(432,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="24" font-weight="700">&gt;50% del GLA nuevo</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Ya es lifestyle center: el</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">modelo recalibrado con datos</text>
  </g>
  <g transform="translate(784,878)">
    <rect width="336" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="22" font-weight="700">Mall mal ubicado</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Sin densidad de ingreso en 5km:</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">la analogía sin ajuste, muere</text>
  </g>

  <!-- Los 4 costos -->
  <text x="80" y="1074" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LO QUE CUESTA LA HIPÓTESIS SIN VALIDAR</text>
  <g transform="translate(80,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="22" font-weight="700">Capital inmovilizado</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Vacancia prolongada sobre deuda</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">que ya devenga costo de oportunidad</text>
  </g>
  <g transform="translate(610,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="22" font-weight="700">Compresión de Cap Rate</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">El pro forma de renta y ocupación</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">no se cumple; el activo se revalúa a la baja</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1286" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · LA LECTURA PARA 2026</text>
  <g transform="translate(80,1306)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">La pregunta correcta no es "¿esto funcionó en otro mercado?"</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Es qué variables específicas lo hicieron funcionar allá, y cuáles de ellas están</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">efectivamente presentes —y verificadas con datos primarios— en este submercado</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: Cushman &amp; Wakefield, Cluster Industrial, El Financiero, Inmobiliare. Cifras ilustrativas, sujetas a verificación con reporte primario.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
