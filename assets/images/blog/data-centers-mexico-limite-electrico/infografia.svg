<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">TECNOLOGÍA · DATA CENTERS EN MÉXICO</text>
  <text x="80" y="216" fill="#ffffff" font-size="30" font-weight="600">El activo industrial que choca</text>
  <text x="80" y="256" fill="#ffffff" font-size="30" font-weight="600">con el límite eléctrico del país</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Querétaro concentra el boom — y también el cuello de botella</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONCENTRACIÓN NACIONAL</text>
    <text x="30" y="118" fill="#ffffff" font-size="58" font-weight="700">79%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">de la capacidad de data</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">centers de México está en Querétaro</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CRECIMIENTO INTERANUAL</text>
    <text x="30" y="118" fill="#ffffff" font-size="58" font-weight="700">+450%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">298.2 MW operativos</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">al 1T26, según CBRE</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">DÉFICIT ELÉCTRICO</text>
    <text x="30" y="118" fill="#ffffff" font-size="58" font-weight="700">900 MW</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">adicionales requeridos</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">solo para sostener lo ya anunciado</text>
  </g>

  <!-- Projects eyebrow -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LOS PROYECTOS QUE REESCRIBEN EL MAPA</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="118" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="118" fill="#d4b45f"/>
    <text x="32" y="38" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">CloudHQ</text>
    <text x="32" y="66" fill="#ffffff" font-size="17" font-weight="600">Campus de 6 edificios · 900 MW de capacidad total</text>
    <text x="32" y="92" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Inversión de $4,800 millones de dólares — operación estimada para 2027</text>
  </g>
  <g transform="translate(80,750)">
    <rect width="1040" height="118" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="118" fill="#d4b45f"/>
    <text x="32" y="38" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">ODATA QR03</text>
    <text x="32" y="66" fill="#ffffff" font-size="17" font-weight="600">24 MW iniciales, escalable a 300 MW hacia finales de 2026</text>
    <text x="32" y="92" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Campus recién inaugurado en el corredor de Querétaro</text>
  </g>
  <g transform="translate(80,884)">
    <rect width="1040" height="118" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="118" fill="#d4b45f"/>
    <text x="32" y="38" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">CAPITAL ACUMULADO DESDE 2021</text>
    <text x="32" y="66" fill="#ffffff" font-size="17" font-weight="600">12+ desarrollos mayores · ~$15,000 millones de dólares comprometidos</text>
    <text x="32" y="92" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Proyección a 4 años: $18,142 mdd de inversión directa · $54,426 mdd de impacto indirecto</text>
  </g>

  <!-- Grid impact -->
  <text x="80" y="1058" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL CUELLO DE BOTELLA ELÉCTRICO</text>
  <g transform="translate(80,1078)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="40" fill="#ffffff" font-size="17" font-weight="600">La escala cambió</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Hace 15 años un data center usaba</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">~6 MW; hoy en Querétaro llegan</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">hasta 30 MW por instalación.</text>
  </g>
  <g transform="translate(610,1078)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="40" fill="#ffffff" font-size="17" font-weight="600">Retrasos de hasta 24 meses</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">CFE y Cenace pueden posponer un</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">proyecto por temas de interconexión.</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">35% de la inversión 2024-26 en riesgo.</text>
  </g>

  <!-- CFE response -->
  <text x="80" y="1270" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LA RESPUESTA DE LA CFE</text>
  <g transform="translate(80,1290)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">Línea de 400,000 V (Querétaro Potencia → Parque Industrialix)</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Entró en operación el 4 de julio de 2026, para abastecer el proyecto O'DATA</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Nuevos proyectos de transmisión sumarían hasta 800 MW adicionales a la región</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="13" font-family="Arial, sans-serif">Fuentes: CBRE, Newsline Report, DataCenterDynamics, Energy Magazine, BNamericas</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
