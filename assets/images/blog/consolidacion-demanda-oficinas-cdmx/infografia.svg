<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">CORPORATIVO · MERCADO DE OFICINAS</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">El 75% no es crecimiento, es</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">consolidación: la demanda real</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Qué mueve realmente la absorción de oficinas Clase A/A+ en la Ciudad de México, 1T 2026</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">DEMANDA POR CONSOLIDACIÓN</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">75%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">De renovación, expansión,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">sublease y pre-leasing (CBRE)</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">ABSORCIÓN NETA · 1T 2026</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">38,000 m&#178;</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Positiva, pero de origen</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">distinto al ciclo anterior</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA PROMEDIO CDMX</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">17.2%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Clase A/A+, -2.3 pp</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">interanual (CBRE)</text>
  </g>

  <!-- Composición de la demanda bars -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">COMPOSICIÓN DE LA DEMANDA BRUTA · 1T 2026</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">RENOVACIÓN, EXPANSIÓN, SUBLEASE Y PRE-LEASING</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">75% de la demanda bruta · empresas ya instaladas optimizando su huella</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="195" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">NUEVOS ENTRANTES AL MERCADO</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">25% de la demanda bruta · el crecimiento especulativo es la minoría</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="65" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Absorción por corredor -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">DÓNDE ATERRIZA LA CONSOLIDACIÓN · ABSORCIÓN NETA (CBRE)</text>
  <g transform="translate(80,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="30" font-weight="700">44%</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">CBD: Polanco, Lomas</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Palmas y Reforma</text>
  </g>
  <g transform="translate(432,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="30" font-weight="700">36%</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Corredor Insurgentes</text>
  </g>
  <g transform="translate(784,878)">
    <rect width="336" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="30" font-weight="700">11.1%</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Vacancia en el CBD, la</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">mitad del promedio general</text>
  </g>

  <!-- Renta y precio -->
  <text x="80" y="1074" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL COSTO DE LA CALIDAD (USD/M&#178;/MES)</text>
  <g transform="translate(80,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">CBD · $27.75</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Renta promedio en el corredor</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">que concentra la consolidación</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">corporativa</text>
  </g>
  <g transform="translate(610,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">Precios 2026 · +8.4%</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Incremento proyectado en renta</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">de oficinas para el año (El</text>
    <text x="32" y="128" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Financiero)</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1286" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · RANGO DE RENTA CLASE A/A+ CDMX</text>
  <g transform="translate(80,1306)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">USD $21.37 – $24.22 por m&#178;/mes, inventario de 7.4 millones de m&#178; (+1% anual, CBRE)</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">La brecha entre el activo consolidado en Clase A+ y el inventario rezagado se</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">amplía cada trimestre que el propietario no reposiciona</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: CBRE MarketView 1T 2026, El Financiero. Rango de renta promedio reconciliado entre reportes de distintos meses del mismo periodo —tratar como rango, no cifra única.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
