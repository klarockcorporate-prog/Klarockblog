<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">GUÍA DE INSTALACIÓN · CLIENTE CORPORATIVO</text>
  <text x="80" y="216" fill="#ffffff" font-size="26" font-weight="600">Shelter o empresa propia: las 3</text>
  <text x="80" y="256" fill="#ffffff" font-size="26" font-weight="600">preguntas antes de instalarte en México</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Estructura legal, due diligence de nave y cronograma real de instalación</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Q1: Shelter vs entidad -->
  <text x="80" y="380" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">1 · SHELTER O EMPRESA PROPIA</text>
  <g transform="translate(80,400)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="28" y="42" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">SHELTER</text>
    <text x="28" y="86" fill="#ffffff" font-size="34" font-weight="700">~90 días</text>
    <text x="28" y="114" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">para arrancar operación,</text>
    <text x="28" y="132" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">bajo IMMEX de un tercero</text>
  </g>
  <g transform="translate(610,400)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="28" y="42" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EMPRESA PROPIA</text>
    <text x="28" y="86" fill="#ffffff" font-size="34" font-weight="700">6-9 meses</text>
    <text x="28" y="114" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">para constituir entidad y</text>
    <text x="28" y="132" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">obtener IMMEX propio</text>
  </g>

  <!-- Q2: Checklist nave -->
  <text x="80" y="612" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">2 · QUÉ REVISAR EN LA NAVE ANTES DE FIRMAR</text>
  <g transform="translate(80,632)">
    <rect width="1040" height="270" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="270" fill="#d4b45f"/>
    <text x="32" y="42" fill="#ffffff" font-size="16" font-weight="600">✓ Título y Certificado de Libertad de Gravamen vigente</text>
    <text x="32" y="82" fill="#ffffff" font-size="16" font-weight="600">✓ Uso de suelo autorizado y licencias de ampliación en regla</text>
    <text x="32" y="122" fill="#ffffff" font-size="16" font-weight="600">✓ Adeudos de predial y agua de los últimos 5 años</text>
    <text x="32" y="162" fill="#ffffff" font-size="16" font-weight="600">✓ Estructura, piso y sistema contra incendio con perito independiente</text>
    <text x="32" y="202" fill="#ffffff" font-size="16" font-weight="600">✓ Subestación eléctrica y KVA disponible auditados</text>
    <text x="32" y="242" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Due diligence documental y técnica: 8-12 semanas antes de firmar</text>
  </g>

  <!-- Q3: Bajio timeline -->
  <text x="80" y="944" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">3 · CRONOGRAMA DE INSTALACIÓN EN EL BAJÍO</text>
  <g transform="translate(80,964)">
    <rect width="335" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="26" y="38" fill="#ffffff" font-size="24" font-weight="700">4-8 sem.</text>
    <text x="26" y="68" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Selección de nave</text>
    <text x="26" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">o terreno</text>
  </g>
  <g transform="translate(432,964)">
    <rect width="335" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="26" y="38" fill="#ffffff" font-size="22" font-weight="700">$300K-800K</text>
    <text x="26" y="68" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">MXN · factibilidad e</text>
    <text x="26" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">interconexión CFE (AID)</text>
  </g>
  <g transform="translate(784,964)">
    <rect width="336" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="26" y="38" fill="#ffffff" font-size="24" font-weight="700">Variable</text>
    <text x="26" y="68" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Permisos municipales</text>
    <text x="26" y="86" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">y uso de suelo</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1174" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL FACTOR CRÍTICO</text>
  <g transform="translate(80,1194)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">La factibilidad eléctrica con CFE es el paso más subestimado</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">La saturación de red en corredores activos puede extender el</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">cronograma si no se audita e inicia el trámite antes de firmar</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: industria shelter/IMMEX, CFE, práctica de due diligence inmobiliaria en México. Rangos de mercado, sujetos a variar por proyecto.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
