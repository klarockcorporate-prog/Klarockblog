<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200 M0,192 H1200 M0,240 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,64)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="185" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">NEARSHORING · MERCADO INDUSTRIAL · 2026</text>
  <text x="80" y="232" fill="#ffffff" font-size="36" font-weight="600">El cuello de botella ya no es la tierra</text>
  <text x="80" y="272" fill="#c3cad9" font-size="17" font-family="Arial, sans-serif">Es la capacidad eléctrica instalada</text>
  <rect x="80" y="298" width="120" height="4" fill="url(#goldbar)"/>

  <!-- ===== Stat grid ===== -->
  <!-- card template: 500x190, two columns, x=80 / x=620, gaps 40 -->

  <!-- Row 1 -->
  <g transform="translate(80,340)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">INVENTARIO MONTERREY · 1T26</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">17.9<tspan font-size="20" fill="#d4b45f"> M m²</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">+9.3% anual — expansión estructural (CBRE)</text>
  </g>
  <g transform="translate(620,340)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">ABSORCIÓN NETA · 1T26</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">212,000<tspan font-size="20" fill="#d4b45f"> m²</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">87% es expansión de empresas ya instaladas</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(80,555)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EMPRESAS CON FALLAS ELÉCTRICAS</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">91<tspan font-size="20" fill="#d4b45f">%</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">De empresas en parques industriales (Inmobiliare)</text>
  </g>
  <g transform="translate(620,555)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">DÉFICIT ENERGÉTICO PROYECTADO</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">48,000<tspan font-size="20" fill="#d4b45f"> MWh</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">A 5 años — recorte real de 16.7% al presupuesto CFE</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(80,770)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">RENTA INDUSTRIAL · CDMX</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">$10.32<tspan font-size="20" fill="#d4b45f"> USD/m²/mes</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">+11% anual</text>
  </g>
  <g transform="translate(620,770)">
    <rect width="500" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="46" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">OCUPACIÓN NUEVO LEÓN</text>
    <text x="36" y="108" fill="#ffffff" font-size="48" font-weight="600">97.2<tspan font-size="20" fill="#d4b45f">%</tspan></text>
    <text x="36" y="140" fill="#c3cad9" font-size="14" font-family="Arial, sans-serif">En más de 45 parques industriales</text>
  </g>

  <!-- Row 4: vacancy by corridor -->
  <g transform="translate(80,985)">
    <rect width="1040" height="190" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="190" fill="#d4b45f"/>
    <text x="36" y="40" fill="#9aa5b1" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA INDUSTRIAL POR CORREDOR · 2026</text>
    <g transform="translate(36,60)" font-family="Arial, sans-serif">
      <text x="0" y="45" fill="#ffffff" font-size="15" font-weight="600">Cd. Juárez</text>
      <rect x="0" y="55" width="960" height="14" rx="3" fill="#16294a"/>
      <rect x="0" y="55" width="145" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="155" y="66" fill="#d4b45f" font-size="14" font-weight="700">9.9%</text>

      <text x="255" y="45" fill="#ffffff" font-size="15" font-weight="600">Monterrey</text>
      <rect x="255" y="55" width="960" height="14" rx="3" fill="#16294a" opacity="0"/>
      <rect x="255" y="55" width="102" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="367" y="66" fill="#d4b45f" font-size="14" font-weight="700">6.9&ndash;7.9%</text>

      <text x="500" y="45" fill="#ffffff" font-size="15" font-weight="600">Querétaro</text>
      <rect x="500" y="55" width="97" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="607" y="66" fill="#d4b45f" font-size="14" font-weight="700">6.6%</text>

      <text x="700" y="45" fill="#ffffff" font-size="15" font-weight="600">Chihuahua</text>
      <rect x="700" y="55" width="81" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="791" y="66" fill="#d4b45f" font-size="14" font-weight="700">5.5%</text>

      <text x="0" y="130" fill="#ffffff" font-size="15" font-weight="600">Guadalajara</text>
      <rect x="0" y="140" width="63" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="73" y="151" fill="#d4b45f" font-size="14" font-weight="700">4.3%</text>

      <text x="255" y="130" fill="#ffffff" font-size="15" font-weight="600">Guanajuato</text>
      <rect x="255" y="140" width="57" height="14" rx="3" fill="url(#goldbar)"/>
      <text x="322" y="151" fill="#d4b45f" font-size="14" font-weight="700">3.9%</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1420" x2="1120" y2="1420" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1400" fill="#6d7690" font-size="13" font-family="Arial, sans-serif">Fuente: CBRE MarketView, Colliers, AMPIP e Inmobiliare (2026). Rangos ilustrativos donde no hubo cifra exacta verificada.</text>
  <text x="1120" y="1400" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
