<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">INDUSTRIAL · NUEVOS PROYECTOS</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">Plan México entrega sus</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">primeros 20 parques industriales</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">USD $711M de derrama económica, rumbo a la meta de 100 parques</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">PARQUES YA EN OPERACIÓN</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">20 / 100</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Primera entrega de la</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">meta de Plan México</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">DERRAMA ECONÓMICA</text>
    <text x="30" y="118" fill="#ffffff" font-size="46" font-weight="700">USD $711M</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">3.5 millones de m² de</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">capacidad instalada</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EMPLEOS DIRECTOS PROYECTADOS</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">62,000</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">De 245 empresas que se</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">instalarán en estos parques</text>
  </g>

  <!-- Dónde están los primeros 20 -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">D&#211;NDE EST&#193;N LOS PRIMEROS 20 PARQUES</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">DISTRIBUIDOS EN 10 ESTADOS DEL PA&#205;S</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">Nuevo León, Baja California, Chihuahua, Jalisco y Ciudad de México, entre otros</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="200" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">15 DESARROLLADORES INMOBILIARIOS EJECUTARON LA FASE 1</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">El capital privado ya está alineado con la meta pública, no esperando al gobierno</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="230" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Panorama nacional -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL PANORAMA NACIONAL DETR&#193;S DE PLAN M&#201;XICO</text>
  <g transform="translate(80,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="24" font-weight="700">103 parques</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">en construcción en 14 estados,</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">21.5 millones de m² en desarrollo</text>
  </g>
  <g transform="translate(432,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="24" font-weight="700">USD $5,830M</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Inversión industrial proyectada</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">2026, +37% vs 2025 ($4,260M)</text>
  </g>
  <g transform="translate(784,878)">
    <rect width="336" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="24" font-weight="700">NL 18% · BC 16%</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Estado de México 12.4% &#8212;los</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">tres corredores más competidos</text>
  </g>

  <!-- Meta y reto -->
  <text x="80" y="1074" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LA META Y EL RETO PARA 2026-2029</text>
  <g transform="translate(80,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">30 parques para fin de 2026</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">10 más sobre los 20 ya entregados,</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">la siguiente señal a vigilar</text>
  </g>
  <g transform="translate(610,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="26" font-weight="700">3,455 MW adicionales</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Necesarios entre 2026 y 2029 para</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">energizar los 103 nuevos parques</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1286" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · LA LECTURA PARA 2026</text>
  <g transform="translate(80,1306)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">El terreno ya no es la única variable: la interconexión eléctrica decide quién llega a tiempo</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Con 103 parques nuevos en construcción y una meta pública que ya entrega resultados,</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">la capacidad eléctrica confirmada se vuelve el filtro real de inversión, no el precio por m²</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: AMPIP, El Universal, Centro Urbano, El Financiero, Cluster Industrial, Revista Fortuna. Cifras de Plan México y proyecciones sectoriales sujetas a actualización oficial.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
