<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">MACROECONÓMICO · ROTACIÓN DE CAPITAL</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">6.50% es el nuevo normal: el capital</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">institucional rota a corredores emergentes</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Tasa ancla, costo de reposición al alza y el mapa de plusvalía por corredor</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">TASA BANXICO · SEP 2026</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">6.50%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Sin cambios desde mayo,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">sin recorte a la vista hasta 2027</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">INFLACIÓN CONSTRUCCIÓN</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">4.15%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Anual a abril 2026</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">(INEGI / CEICO-CMIC)</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">INVERSIÓN NEARSHORING</text>
    <text x="30" y="118" fill="#ffffff" font-size="44" font-weight="700">$35,000M</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">USD anunciados 2021-2025,</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Bajío y Norte</text>
  </g>

  <!-- Renta por corredor eyebrow -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">RENTA INDUSTRIAL PROMEDIO · USD / M² MENSUAL</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">PROMEDIO NACIONAL</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">USD $7.29 / m² · mediados de 2026</text>
    <rect x="620" y="24" width="380" height="14" rx="7" fill="#203a63"/>
    <rect x="620" y="24" width="380" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">CORREDOR DEL BAJÍO</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">USD $5.00 – $6.20 / m² · punto de entrada más bajo</text>
    <rect x="620" y="24" width="380" height="14" rx="7" fill="#203a63"/>
    <rect x="620" y="24" width="280" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- Rotación de capital -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LA ROTACIÓN · DE LO CONSOLIDADO A LO EMERGENTE</text>
  <g transform="translate(80,878)">
    <rect width="510" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="44" fill="#ffffff" font-size="22" font-weight="700">CDMX / Monterrey</text>
    <text x="28" y="76" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Mercados maduros. Cap Rate</text>
    <text x="28" y="94" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">comprimido, menos recorrido</text>
    <text x="28" y="112" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">de plusvalía que hace 3 años</text>
  </g>
  <g transform="translate(610,878)">
    <rect width="510" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="44" fill="#ffffff" font-size="22" font-weight="700">Bajío / Norte</text>
    <text x="28" y="76" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Corredores emergentes.</text>
    <text x="28" y="94" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Inversión de nearshoring</text>
    <text x="28" y="112" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">concentrada, mayor recorrido</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1114" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · MANO DE OBRA E INSUMOS</text>
  <g transform="translate(80,1134)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">Escasez de mano de obra calificada: hasta +15% en ciertos proyectos</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Insumos ligados a manufactura: +5% a +7% de presión adicional por</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">demanda de nearshoring, encareciendo la oferta nueva frente al activo existente</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: Banxico, El Financiero, INEGI, CEICO-CMIC. Cifras de renta e inversión: rangos de mercado, verificar contra reporte fuente.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
