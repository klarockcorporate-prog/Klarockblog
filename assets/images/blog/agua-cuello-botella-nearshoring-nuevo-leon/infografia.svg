<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c37a"/>
      <stop offset="100%" stop-color="#a5812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1560" fill="url(#bg)"/>
  <g stroke="#d4b45f" stroke-opacity="0.05">
    <path d="M0,0 H1200 M0,48 H1200 M0,96 H1200 M0,144 H1200"/>
  </g>

  <!-- Header -->
  <g transform="translate(80,58)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#c9a84c"/>
    <g transform="translate(13,10) scale(0.32)">
      <rect x="0" y="0" width="16" height="76" rx="3" fill="#0f2647"/>
      <rect x="20" y="44" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="37" y="29" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="54" y="14" width="15" height="15" rx="3" fill="#0f2647"/>
      <rect x="20" y="17" width="15" height="15" rx="3" fill="#0f2647"/>
    </g>
    <text x="62" y="20" fill="#f5f5f0" font-size="20" font-weight="600" letter-spacing="2">KLAROCK</text>
    <text x="62" y="38" fill="#9aa5b1" font-size="9" letter-spacing="3" font-family="Arial, sans-serif">CORPORATE REAL ESTATE</text>
  </g>

  <text x="80" y="172" fill="#d4b45f" font-size="14" letter-spacing="4" font-family="Arial, sans-serif" font-weight="700">INDUSTRIAL · NUEVO LEÓN</text>
  <text x="80" y="216" fill="#ffffff" font-size="27" font-weight="600">El cuarto cuello de botella</text>
  <text x="80" y="256" fill="#ffffff" font-size="27" font-weight="600">del nearshoring: el agua</text>
  <text x="80" y="292" fill="#c3cad9" font-size="16" font-family="Arial, sans-serif">Cómo la escasez hídrica en Nuevo León ya condiciona la ubicación de la próxima planta</text>
  <rect x="80" y="316" width="120" height="4" fill="url(#goldbar)"/>

  <!-- Big stat row -->
  <g transform="translate(80,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">VACANCIA INDUSTRIAL NL 2025</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">3.7%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Mercado prácticamente sin</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">margen de maniobra</text>
  </g>
  <g transform="translate(432,356)">
    <rect width="335" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">OCUPACIÓN EN APODACA</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">96-97%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Uno de los submercados más</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">saturados del estado</text>
  </g>
  <g transform="translate(784,356)">
    <rect width="336" height="180" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.35"/>
    <text x="30" y="46" fill="#d4b45f" font-size="12" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">REDUCCIÓN DE AGUA POTABLE</text>
    <text x="30" y="118" fill="#ffffff" font-size="52" font-weight="700">-80%</text>
    <text x="30" y="150" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Con sistemas de reúso hídrico</text>
    <text x="30" y="167" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">tipo FINSA</text>
  </g>

  <!-- Cuatro cuellos de botella -->
  <text x="80" y="596" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LOS CUATRO FRENOS QUE HOY REORDENAN DÓNDE SE CONSTRUYE</text>

  <g transform="translate(80,616)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">AGUA · EL FRENO MENOS VISIBLE, EL MÁS DIFÍCIL DE RESOLVER</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">2026 declarado por el Congreso de Nuevo León como "Año del Agua"</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="230" height="14" rx="7" fill="#d4b45f"/>
  </g>
  <g transform="translate(80,716)">
    <rect width="1040" height="90" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="6" height="90" fill="#d4b45f"/>
    <text x="32" y="36" fill="#e6cf94" font-size="14" font-family="Arial, sans-serif" font-weight="700">VIVIENDA, ENERGÍA Y MANO DE OBRA · LOS OTROS TRES</text>
    <text x="32" y="66" fill="#ffffff" font-size="20" font-weight="600">Compiten por la misma infraestructura que el agua en los mismos municipios</text>
    <rect x="740" y="24" width="260" height="14" rx="7" fill="#203a63"/>
    <rect x="740" y="24" width="170" height="14" rx="7" fill="#d4b45f"/>
  </g>

  <!-- La respuesta del mercado -->
  <text x="80" y="858" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">LA RESPUESTA DE LOS DESARROLLADORES</text>
  <g transform="translate(80,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="26" font-weight="700">USD $220M</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Master plan de FINSA en García,</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">NL &#8212;92 hectáreas, 17 naves</text>
  </g>
  <g transform="translate(432,878)">
    <rect width="335" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="30" font-weight="700">Reúso hídrico</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Ya es criterio de diseño, no</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">un extra de sustentabilidad</text>
  </g>
  <g transform="translate(784,878)">
    <rect width="336" height="130" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="28" y="42" fill="#ffffff" font-size="30" font-weight="700">4/4</text>
    <text x="28" y="70" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Frenos que ya se negocian</text>
    <text x="28" y="88" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">directo con el municipio</text>
  </g>

  <!-- Riesgo operativo -->
  <text x="80" y="1074" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">EL RIESGO PARA UNA OPERACIÓN YA INSTALADA</text>
  <g transform="translate(80,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="24" font-weight="700">Restricciones de suministro</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Cortes o reducción de presión que</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">ya golpearon el uso doméstico</text>
  </g>
  <g transform="translate(610,1094)">
    <rect width="510" height="150" rx="4" fill="#16294a" stroke="#d4b45f" stroke-opacity="0.25"/>
    <text x="32" y="46" fill="#ffffff" font-size="24" font-weight="700">Costo de continuidad</text>
    <text x="32" y="92" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">Interrupciones que se traducen en</text>
    <text x="32" y="110" fill="#c3cad9" font-size="13" font-family="Arial, sans-serif">pérdida de producción, no solo en tarifa</text>
  </g>

  <!-- Contexto -->
  <text x="80" y="1286" fill="#d4b45f" font-size="13" letter-spacing="2" font-family="Arial, sans-serif" font-weight="700">CONTEXTO · LA LECTURA PARA 2026</text>
  <g transform="translate(80,1306)">
    <rect width="1040" height="120" rx="4" fill="#0f1f38" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="42" fill="#ffffff" font-size="17" font-weight="600">La disponibilidad hídrica certificada ya separa al parque industrial invertible del que no lo es</text>
    <text x="32" y="68" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">Con vacancia de 3.7% y ocupación de hasta 97% en submercados clave, el agua</text>
    <text x="32" y="94" fill="#9aa5b1" font-size="13" font-family="Arial, sans-serif">se volvió tan crítica en la due diligence como el título de propiedad</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1470" x2="1120" y2="1470" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="80" y="1450" fill="#6d7690" font-size="12" font-family="Arial, sans-serif">Fuentes: Expansión ESG, Observatorio de Ciudades, Inmobiliare, Centro Urbano, Monitor Negocios, FINSA. Cifras de vacancia y ocupación de cobertura de mercado, no de un reporte único de consultora.</text>
  <text x="1120" y="1450" fill="#d4b45f" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="700">klarock.mx</text>
</svg>
