<!--
  Klarock — snippet de analítica (GA4 / Meta Pixel / LinkedIn Insight Tag)

  Este archivo NO está incluido en ninguna página todavía. Todo el tracking de
  property-enhancements.js (view_property_details, download_property_brochure,
  generate_lead_property) ya está listo y llama a gtag()/fbq() de forma segura:
  si no existen, simplemente no hace nada. No pasa nada roto mientras tanto.

  Para activarlo:
  1. Reemplaza los IDs de ejemplo (G-XXXXXXXXXX, TU_PIXEL_ID, TU_PARTNER_ID) por
     los reales de Klarock.
  2. Pega este bloque dentro de <head>, justo antes de </head>, en TODAS las
     páginas del sitio (index, blog y fichas de propiedad). Al ser un cambio
     mecánico y repetitivo en decenas de archivos, lo más simple es pedir que
     se aplique con un script una vez tengas los IDs reales, igual que se hizo
     con el resto de estas mejoras.
-->

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<!-- Meta Pixel -->
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', 'TU_PIXEL_ID');
  fbq('track', 'PageView');
</script>

<!-- LinkedIn Insight Tag -->
<script type="text/javascript">
  _linkedin_partner_id = "TU_PARTNER_ID";
  window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
  window._linkedin_data_partner_ids.push(_linkedin_partner_id);
</script>
<script type="text/javascript">
  (function(l) {
    if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
    window.lintrk.q=[]}
    var s = document.getElementsByTagName("script")[0];
    var b = document.createElement("script");
    b.type = "text/javascript";b.async = true;
    b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
    s.parentNode.insertBefore(b, s);
  })(window.lintrk);
</script>
